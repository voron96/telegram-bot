
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта підробітків Києва</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  background: #f1f5f9;
}

.header {
  padding: 12px;
  background: white;
  z-index: 1000;
  box-shadow: 0 2px 8px #00000012;
}

h2 {
  margin: 0 0 10px;
  font-size: 20px;
  color: #263746;
}

.search {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
}

button {
  padding: 12px 16px;
  border: 0;
  border-radius: 9px;
  background: #1684e8;
  color: white;
  font-size: 15px;
}

#map {
  flex: 1;
  min-height: 300px;
}

#status {
  font-size: 13px;
  color: #64748b;
  margin-top: 8px;
}

.legend {
  padding: 8px 12px;
  background: white;
  font-size: 12px;
  color: #334155;
}
</style>
</head>

<body>

<div class="header">
  <h2>🗺️ Карта підробітків</h2>

  <div class="search">
    <input id="address" placeholder="Введіть місто або адресу">
    <button onclick="searchAddress()">Знайти</button>
  </div>

  <div id="status">
    Знайдіть адресу або натисніть на карту, щоб поставити мітку.
  </div>
</div>

<div id="map"></div>

<div class="legend">
  🚇 Лінії метро та станції Києва
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([50.4501, 30.5234], 9);

// Світла карта замість коричневого оформлення
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }
).addTo(map);

let marker = null;

function setMarker(lat, lon, label) {
  if (marker) map.removeLayer(marker);

  marker = L.marker([lat, lon]).addTo(map);
  marker.bindPopup(label || 'Вибране місце').openPopup();

  map.setView([lat, lon], 16);

  document.getElementById('status').textContent =
    'Координати: ' + lat.toFixed(5) + ', ' + lon.toFixed(5);
}

map.on('click', function(e) {
  setMarker(e.latlng.lat, e.latlng.lng, 'Вибране місце');
});

// Пошук адрес
async function searchAddress() {
  const q = document.getElementById('address').value.trim();
  const status = document.getElementById('status');

  if (!q) {
    status.textContent = 'Введіть адресу.';
    return;
  }

  status.textContent = 'Шукаємо адресу...';

  try {
    const url =
      'https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine='
      + encodeURIComponent(q + ', Київська область, Україна')
      + '&maxLocations=1&f=pjson';

    const response = await fetch(url);
    const data = await response.json();

    if (!data.candidates || !data.candidates.length) {
      status.textContent = 'Адресу не знайдено.';
      return;
    }

    const result = data.candidates[0];

    setMarker(
      result.location.y,
      result.location.x,
      result.address
    );

    status.textContent = 'Знайдено: ' + result.address;

  } catch (error) {
    status.textContent = 'Помилка пошуку. Спробуйте ще раз.';
  }
}

document.getElementById('address').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchAddress();
});

// Завантаження метро Києва з OpenStreetMap
async function loadMetro() {
  const status = document.getElementById('status');

  const query = `
    [out:json][timeout:30];
    (
      relation["route"="subway"](50.25,30.15,50.65,30.85);
      node["railway"="station"]["station"="subway"](50.25,30.15,50.65,30.85);
    );
    out geom;
  `;

  const endpoints = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];

  let data = null;

  for (const endpoint of endpoints) {
    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query)
      });

      if (!response.ok) continue;

      data = await response.json();
      break;
    } catch (error) {
      console.log('Metro endpoint error:', error);
    }
  }

  if (!data) {
    status.textContent =
      'Карта доступна. Дані метро тимчасово не завантажилися.';
    return;
  }

  const colors = [
    '#e53935',
    '#1684e8',
    '#20a36b'
  ];

  let lineNumber = 0;

  data.elements.forEach(element => {
    if (element.type === 'relation' &&
        element.tags &&
        element.tags.route === 'subway') {

      const color = colors[lineNumber % colors.length];
      lineNumber++;

      (element.members || []).forEach(member => {
        if (member.type === 'way' && member.geometry) {
          const coords = member.geometry.map(point => [
            point.lat, point.lon
          ]);

          L.polyline(coords, {
            color: color,
            weight: 5,
            opacity: 0.9
          }).addTo(map);
        }
      });
    }

    if (element.type === 'node' &&
        element.lat && element.lon) {

      const station = L.circleMarker(
        [element.lat, element.lon],
        {
          radius: 5,
          color: '#ffffff',
          weight: 2,
          fillColor: '#1684e8',
          fillOpacity: 1
        }
      ).addTo(map);

      station.bindPopup(
        '🚇 ' + (element.tags.name || 'Станція метро')
      );
    }
  });

  status.textContent =
    'Карта готова. Можна шукати адреси та ставити мітки.';
}

loadMetro();
</script>

</body>
</html>
