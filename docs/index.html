
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта підробітків Києва та області</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  background: #f1f5f9;
}

.header {
  padding: 12px;
  background: white;
  z-index: 1000;
  box-shadow: 0 2px 8px #0002;
}

h2 {
  margin: 0 0 10px;
  font-size: 19px;
  color: #263746;
}

.search {
  display: flex;
  gap: 7px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
}

button {
  padding: 11px 14px;
  border: 0;
  border-radius: 9px;
  background: #1684e8;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

#status {
  font-size: 12px;
  color: #64748b;
  margin-top: 7px;
}

#results {
  display: none;
  margin-top: 7px;
  max-height: 190px;
  overflow-y: auto;
  border: 1px solid #dbe3ec;
  border-radius: 8px;
  background: white;
}

.search-result {
  display: block;
  width: 100%;
  text-align: left;
  background: white;
  color: #263746;
  border-radius: 0;
  border-bottom: 1px solid #e2e8f0;
  font-size: 13px;
  padding: 10px;
}

.search-result:hover {
  background: #eff6ff;
}

#map {
  flex: 1;
  min-height: 300px;
  width: 100%;
}

.city-label {
  background: rgba(255,255,255,0.94);
  border: 1px solid #64748b;
  border-radius: 4px;
  color: #263746;
  font-size: 12px;
  font-weight: bold;
  padding: 3px 5px;
  white-space: nowrap;
  box-shadow: 0 1px 4px #0002;
}

.metro-icon {
  width: 29px;
  height: 29px;
  border: 3px solid var(--line-color);
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  box-shadow: 0 1px 5px #0006;
}

.metro-label {
  color: #172033;
  background: rgba(255,255,255,0.95);
  border: 1px solid var(--line-color);
  border-radius: 4px;
  padding: 2px 4px;
  font-size: 10px;
  font-weight: bold;
  white-space: nowrap;
  box-shadow: 0 1px 4px #0003;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 9px 12px;
  background: white;
  font-size: 12px;
  color: #334155;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

@media (max-width: 480px) {
  h2 { font-size: 17px; }
  .header { padding: 9px; }
  .legend { gap: 8px; font-size: 11px; }
}
</style>
</head>

<body>

<div class="header">
  <h2>🗺️ Карта підробітків Києва та області</h2>

  <div class="search">
    <input id="address" placeholder="Місто, вулиця або адреса">
    <button id="searchButton" onclick="searchAddress()">Знайти</button>
  </div>

  <div id="results"></div>

  <div id="status">
    Натисніть на карту, щоб вибрати місце.
  </div>
</div>

<div id="map"></div>

<div class="legend">
  <div class="legend-item">
    <span class="dot" style="background:#e53935"></span>
    Червона лінія
  </div>
  <div class="legend-item">
    <span class="dot" style="background:#1684e8"></span>
    Синя лінія
  </div>
  <div class="legend-item">
    <span class="dot" style="background:#20a36b"></span>
    Зелена лінія
  </div>
  <div class="legend-item">🚇 Метро</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= КАРТА =================

const STORAGE_KEY = 'parttime_map_view';

let savedView = null;

try {
  savedView = JSON.parse(localStorage.getItem(STORAGE_KEY));
} catch(e) {}

const initialCenter =
  savedView &&
  Array.isArray(savedView.center) &&
  savedView.center.length === 2
    ? savedView.center
    : [50.4501, 30.5234];

const initialZoom =
  savedView && Number.isFinite(savedView.zoom)
    ? savedView.zoom
    : 9;

const map = L.map('map').setView(initialCenter, initialZoom);

// Основна карта
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }
).addTo(map);

// Запам'ятовування масштабу та місця перегляду
map.on('moveend', function() {
  try {
    const center = map.getCenter();

    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      center: [center.lat, center.lng],
      zoom: map.getZoom()
    }));
  } catch(e) {}
});

let marker = null;

// ================= ВИБІР МІСЦЯ =================

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

function setMarker(lat, lon, label) {
  if (marker) map.removeLayer(marker);

  marker = L.marker([lat, lon]).addTo(map);

  marker.bindPopup(
    '<b>' + escapeHTML(label || 'Вибране місце') + '</b>'
  ).openPopup();

  map.setView([lat, lon], 16);

  document.getElementById('status').textContent =
    'Обране місце: ' +
    lat.toFixed(5) + ', ' + lon.toFixed(5);
}

map.on('click', function(e) {
  setMarker(e.latlng.lat, e.latlng.lng, 'Вибране місце');
});

// ================= ПОШУК АДРЕСИ =================

async function searchAddress() {
  const input = document.getElementById('address');
  const status = document.getElementById('status');
  const resultsBox = document.getElementById('results');
  const button = document.getElementById('searchButton');

  const q = input.value.trim();

  if (!q) {
    status.textContent = 'Введіть місто, вулицю або адресу.';
    return;
  }

  resultsBox.style.display = 'none';
  resultsBox.innerHTML = '';
  status.textContent = 'Шукаємо адресу...';
  button.disabled = true;

  try {
    const params = new URLSearchParams({
      q: q + ', Україна',
      format: 'jsonv2',
      addressdetails: '1',
      limit: '7',
      countrycodes: 'ua',
      'accept-language': 'uk',
      viewbox: '29.35,51.05,31.15,50.05',
      bounded: '0'
    });

    const url =
      'https://nominatim.openstreetmap.org/search?' +
      params.toString();

    const response = await fetch(url, {
      headers: {
        'Accept': 'application/json'
      }
    });

    if (!response.ok) {
      throw new Error('Помилка сервера пошуку');
    }

    const data = await response.json();

    if (!data.length) {
      status.textContent =
        'Нічого не знайдено. Спробуйте ввести назву інакше.';
      return;
    }

    resultsBox.innerHTML = '';

    data.forEach(function(item) {
      const resultButton = document.createElement('button');

      resultButton.className = 'search-result';
      resultButton.textContent = item.display_name;

      resultButton.onclick = function() {
        const lat = Number(item.lat);
        const lon = Number(item.lon);

        setMarker(lat, lon, item.display_name);

        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';

        status.textContent = 'Знайдено: ' + item.display_name;
      };

      resultsBox.appendChild(resultButton);
    });

    resultsBox.style.display = 'block';

    status.textContent =
      'Знайдено варіантів: ' + data.length +
      '. Виберіть потрібну адресу.';

    if (data.length === 1) {
      const item = data[0];
      setMarker(Number(item.lat), Number(item.lon), item.display_name);
      resultsBox.style.display = 'none';
    }

  } catch(e) {
    console.log('Search error:', e);
    status.textContent =
      'Помилка пошуку. Перевірте інтернет і спробуйте ще раз.';
  } finally {
    button.disabled = false;
  }
}

document.getElementById('address').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') searchAddress();
});

// ================= OPENSTREETMAP =================

async function overpassRequest(query) {
  const endpoints = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];

  for (const endpoint of endpoints) {
    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'data=' + encodeURIComponent(query)
      });

      if (!response.ok) continue;

      return await response.json();

    } catch(e) {
      console.log('Overpass error:', e);
    }
  }

  throw new Error('Дані карти тимчасово недоступні');
}

// ================= НАЗВИ МІСТ І РАЙОНІВ =================

const placesLayer = L.layerGroup().addTo(map);

async function loadPlaces() {
  const query = `
    [out:json][timeout:35];
    (
      node["place"~"city|town|village|suburb|neighbourhood"]
      (50.05,29.35,51.05,31.15);
    );
    out body;
  `;

  try {
    const data = await overpassRequest(query);

    data.elements.forEach(function(place) {
      if (!place.lat || !place.lon || !place.tags.name) return;

      const name = place.tags['name:uk'] || place.tags.name;

      const label = L.marker(
        [place.lat, place.lon],
        {
          interactive: false,
          icon: L.divIcon({
            className: '',
            html: '<div class="city-label">' +
              escapeHTML(name) + '</div>',
            iconSize: null,
            iconAnchor: [0, 0]
          })
        }
      );

      placesLayer.addLayer(label);
    });

    console.log('Place labels loaded:', data.elements.length);

  } catch(e) {
    console.log('Place labels unavailable:', e);
  }
}

// ================= МЕТРО КИЄВА =================

const metroLines = {
  red: {
    name: 'Червона — Святошинсько-Броварська',
    color: '#e53935',
    stations: [
      'академмістечко', 'житомирська', 'святошин',
      'нивки', 'берестейська', 'шулявська',
      'політехнічний інститут', 'вокзальна',
      'університет', 'театральна', 'хрещатик',
      'арсенальна', 'дніпро', 'гідропарк',
      'лівобережна', 'дарниця', 'чернігівська',
      'лісова'
    ]
  },

  blue: {
    name: 'Синя — Оболонсько-Теремківська',
    color: '#1684e8',
    stations: [
      'героїв дніпра', 'мінська', 'оболонь',
      'почайна', 'тарасa шевченка', 'тарас шевченка',
      'контрактова площа', 'поштова площа',
      'майдан незалежності', 'площа українських героїв',
      'олімпійська', 'палац україна', 'либі́дська',
      'либідська', 'деміївська', 'голосіївська',
      'васильківська', 'виставковий центр',
      'іподром', 'теремки'
    ]
  },

  green: {
    name: 'Зелена — Сирецько-Печерська',
    color: '#20a36b',
    stations: [
      'сирець', 'дорогожичі', 'лукянівська',
      'золоті ворота', 'палац спорту',
      'кловська', 'печерська', 'зверинецька',
      'видубичі', 'славутич', 'осокорки',
      'позняки', 'харківська', 'вирлиця',
      'бориспільська', 'червоний хутір'
    ]
  }
};

function normalizeName(value) {
  return String(value || '')
    .toLowerCase()
    .replace(/[’ʼ`']/g, '')
    .replace(/[ії]/g, function(c) {
      return c === 'і' ? 'и' : 'и';
    })
    .replace(/ґ/g, 'г')
    .replace(/[^а-яa-z0-9 ]/gi, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function getMetroLine(stationName) {
  const name = normalizeName(stationName);

  for (const key of Object.keys(metroLines)) {
    const found = metroLines[key].stations.some(function(station) {
      const normalized = normalizeName(station);
      return name === normalized ||
        name.includes(normalized) ||
        normalized.includes(name);
    });

    if (found) return metroLines[key];
  }

  return null;
}

const metroLayer = L.layerGroup().addTo(map);

async function loadMetro() {
  const query = `
    [out:json][timeout:45];
    (
      nwr["railway"="station"]["station"="subway"]
      (50.25,30.15,50.65,30.85);

      nwr["railway"="station"]["subway"="yes"]
      (50.25,30.15,50.65,30.85);

      nwr["station"="subway"]
      (50.25,30.15,50.65,30.85);

      nwr["public_transport"="station"]["subway"="yes"]
      (50.25,30.15,50.65,30.85);
    );
    out center tags;
  `;

  try {
    const data = await overpassRequest(query);

    const added = new Set();
    let count = 0;

    data.elements.forEach(function(station) {
      const lat = station.lat || (station.center && station.center.lat);
      const lon = station.lon || (station.center && station.center.lon);

      if (!lat || !lon) return;

      const tags = station.tags || {};

      const name =
        tags['name:uk'] ||
        tags.name ||
        tags['name'] ||
        'Станція метро';

      const line = getMetroLine(name);

      if (!line) {
        console.log('Невідома станція метро:', name);
        return;
      }

      const uniqueKey = normalizeName(name);

      if (added.has(uniqueKey)) return;
      added.add(uniqueKey);

      const icon = L.divIcon({
        className: '',
        html:
          '<div class="metro-icon" style="--line-color:' +
          line.color +
          '">🚇</div>',
        iconSize: [29, 29],
        iconAnchor: [14, 14]
      });

      const metroMarker = L.marker([lat, lon], {
        icon: icon,
        zIndexOffset: 1000
      });

      metroMarker.bindPopup(
        '<b>🚇 ' + escapeHTML(name) + '</b><br>' +
        '<span style="color:' + line.color + ';font-weight:bold">' +
        escapeHTML(line.name) + '</span>'
      );

      metroLayer.addLayer(metroMarker);

      const label = L.marker([lat, lon], {
        interactive: false,
        icon: L.divIcon({
          className: '',
          html:
            '<div class="metro-label" style="--line-color:' +
            line.color + '">' +
            escapeHTML(name) +
            '</div>',
          iconSize: null,
          iconAnchor: [-13, 5]
        })
      });

      metroLayer.addLayer(label);

      count++;
    });

    console.log('Metro stations loaded:', count);

    if (count === 0) {
      document.getElementById('status').textContent =
        'Карта завантажена. Дані метро поки недоступні.';
    }

  } catch(e) {
    console.log('Metro unavailable:', e);
  }
}

// ================= ЗАПУСК =================

document.getElementById('status').textContent =
  'Карта завантажена. Завантажуємо назви міст і метро...';

loadPlaces();
loadMetro();

</script>
</body>
</html>
