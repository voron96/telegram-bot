
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта підробітків Києва та області</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  background: #f1f5f9;
}

.header {
  padding: 12px;
  background: white;
  z-index: 1000;
  box-shadow: 0 2px 8px #0002;
}

h2 {
  margin: 0 0 10px;
  font-size: 19px;
  color: #263746;
}

.search {
  display: flex;
  gap: 7px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
}

button {
  padding: 11px 14px;
  border: 0;
  border-radius: 9px;
  background: #1684e8;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

#status {
  font-size: 12px;
  color: #64748b;
  margin-top: 7px;
}

#results {
  display: none;
  margin-top: 7px;
  max-height: 180px;
  overflow-y: auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.result {
  display: block;
  width: 100%;
  padding: 10px;
  text-align: left;
  background: white;
  color: #263746;
  border-radius: 0;
  border-bottom: 1px solid #eee;
  font-size: 13px;
}

.result:hover {
  background: #f1f5f9;
}

#map {
  flex: 1;
  min-height: 300px;
  width: 100%;
}
</style>
</head>

<body>

<div class="header">
  <h2>🗺️ Карта підробітків Києва та області</h2>

  <div class="search">
    <input id="address" placeholder="Місто, вулиця або адреса">
    <button id="searchButton" onclick="searchAddress()">Знайти</button>
  </div>

  <div id="results"></div>
  <div id="status">Введіть адресу або натисніть на карту.</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ===== КАРТА =====

const STORAGE_KEY = 'parttime_map_view';

let savedView = null;

try {
  savedView = JSON.parse(localStorage.getItem(STORAGE_KEY));
} catch(e) {}

const center =
  savedView &&
  Array.isArray(savedView.center) &&
  savedView.center.length === 2
    ? savedView.center
    : [50.4501, 30.5234];

const zoom =
  savedView && Number.isFinite(savedView.zoom)
    ? savedView.zoom
    : 9;

const map = L.map('map').setView(center, zoom);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }
).addTo(map);

// Зберігаємо останній перегляд

map.on('moveend', function() {
  try {
    const c = map.getCenter();

    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      center: [c.lat, c.lng],
      zoom: map.getZoom()
    }));
  } catch(e) {}
});

// ===== ПОЗНАЧКА НА КАРТІ =====

let marker = null;

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

function setMarker(lat, lon, label) {
  if (marker) {
    map.removeLayer(marker);
  }

  marker = L.marker([lat, lon]).addTo(map);

  marker.bindPopup(
    '<b>' + escapeHTML(label) + '</b>'
  ).openPopup();

  map.setView([lat, lon], 16);

  document.getElementById('status').textContent =
    'Обране місце: ' + label;
}

map.on('click', function(e) {
  setMarker(
    e.latlng.lat,
    e.latlng.lng,
    'Вибране місце'
  );
});

// ===== ПОШУК =====

async function searchAddress() {
  const input = document.getElementById('address');
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const button = document.getElementById('searchButton');

  const q = input.value.trim();

  if (!q) {
    status.textContent = 'Введіть адресу.';
    return;
  }

  button.disabled = true;
  status.textContent = 'Шукаємо адресу...';
  results.style.display = 'none';
  results.innerHTML = '';

  try {
    let found = [];

    // Спочатку шукаємо через Photon
    try {
      const params = new URLSearchParams({
        q: q + ', Україна',
        lang: 'uk',
        limit: '6',
        lat: '50.4501',
        lon: '30.5234'
      });

      const response = await fetch(
        'https://photon.komoot.io/api/?' + params.toString()
      );

      if (response.ok) {
        const data = await response.json();

        found = (data.features || []).map(function(item) {
          const p = item.properties || {};
          const coords = item.geometry.coordinates;

          const label = [
            p.name,
            p.housenumber,
            p.street,
            p.city || p.town || p.village,
            p.state
          ].filter(Boolean).join(', ');

          return {
            lat: coords[1],
            lon: coords[0],
            label: label || q
          };
        });
      }
    } catch(e) {
      console.log('Photon unavailable:', e);
    }

    // Якщо перший пошук не спрацював — резервний
    if (!found.length) {
      const params = new URLSearchParams({
        q: q + ', Україна',
        format: 'jsonv2',
        addressdetails: '1',
        limit: '6',
        countrycodes: 'ua',
        'accept-language': 'uk',
        viewbox: '29.35,51.05,31.15,50.05',
        bounded: '0'
      });

      const response = await fetch(
        'https://nominatim.openstreetmap.org/search?' +
        params.toString()
      );

      if (!response.ok) {
        throw new Error('Пошук тимчасово недоступний');
      }

      const data = await response.json();

      found = data.map(function(item) {
        return {
          lat: Number(item.lat),
          lon: Number(item.lon),
          label: item.display_name
        };
      });
    }

    if (!found.length) {
      status.textContent =
        'Адресу не знайдено. Спробуйте інше написання.';
      return;
    }

    results.innerHTML = '';

    found.forEach(function(item) {
      const btn = document.createElement('button');

      btn.className = 'result';
      btn.textContent = item.label;

      btn.onclick = function() {
        setMarker(item.lat, item.lon, item.label);
        results.style.display = 'none';
        results.innerHTML = '';
      };

      results.appendChild(btn);
    });

    if (found.length === 1) {
      setMarker(
        found[0].lat,
        found[0].lon,
        found[0].label
      );
    } else {
      results.style.display = 'block';
      status.textContent =
        'Знайдено варіантів: ' + found.length +
        '. Виберіть потрібну адресу.';
    }

  } catch(e) {
    console.log('Search error:', e);

    status.textContent =
      'Пошук тимчасово не працює. Спробуйте пізніше.';
  } finally {
    button.disabled = false;
  }
}

document.getElementById('address').addEventListener(
  'keydown',
  function(e) {
    if (e.key === 'Enter') searchAddress();
  }
);

</script>
</body>
</html>
