
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Карта підробітків Києва та області</title>

<link rel="stylesheet" href="./leaflet.css">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
}

.header {
  flex: 0 0 auto;
  padding: 8px 12px;
  background: transparent;
  box-shadow: none;
}

h2 {
  margin: 0 0 10px;
  font-size: 18px;
  color: #263746;
}

.search {
  display: flex;
  gap: 7px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #1684e8;
}

button {
  padding: 11px 13px;
  border: 0;
  border-radius: 9px;
  background: #1684e8;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

#results {
  display: none;
  margin-top: 7px;
  max-height: 180px;
  overflow-y: auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.result {
  display: block;
  width: 100%;
  padding: 11px;
  text-align: left;
  background: white;
  color: #263746;
  border-radius: 0;
  border-bottom: 1px solid #eee;
  line-height: 1.4;
}

.result:hover {
  background: #f1f5f9;
}

#status {
  margin-top: 7px;
  min-height: 15px;
  font-size: 12px;
  color: #64748b;
}

#map {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  background: #edf1f3;
}

#menuButton {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 1000;
  width: 46px;
  height: 46px;
  padding: 0;
  border-radius: 50%;
  background: #1684e8;
  color: white;
  font-size: 30px;
  line-height: 46px;
  text-align: center;
  box-shadow: 0 2px 8px #0004;
}
  
#mapMenu {
  position: absolute;
  top: 12px;
  left: 62px;
  z-index: 1001;
  display: flex;
  gap: 6px;
  padding: 5px;
  background: rgba(255,255,255,0.92);
  border-radius: 12px;
  box-shadow: 0 2px 8px #0003;
}

#mapMenu button {
  padding: 9px 11px;
  border-radius: 9px;
  font-size: 13px;
  white-space: nowrap;
}

#searchPanel {
  position: absolute;
  top: 62px;
  left: 12px;
  right: 12px;
  z-index: 1001;
  padding: 9px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 2px 10px #0003;
}
  
.footer {
  flex: 0 0 auto;
  padding: 10px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: white;
  box-shadow: 0 -2px 8px #0002;
  z-index: 1000;
}

.mode-label {
  display: none;
  margin-bottom: 8px;
  padding: 9px;
  border-radius: 8px;
  background: #eff6ff;
  color: #1d4e89;
  font-size: 13px;
  text-align: center;
}

.button-row {
  display: flex;
  gap: 7px;
}

.button-row button {
  flex: 1;
  min-width: 0;
  padding: 11px 6px;
  font-size: 12px;
}

.gps-button { background: #1684e8; }
.home-button { background: #475569; }
.save-button { background: #15965c; }
.cancel-button { background: #64748b; }

.leaflet-popup-content {
  line-height: 1.5;
  overflow-wrap: anywhere;
}

@media (max-width: 380px) {
  h2 { font-size: 16px; }
  .button-row { flex-wrap: wrap; }
  .button-row button { flex: 1 1 30%; }
}
</style>
</head>

<body>

<div class="header">
  <h2>🗺️ Карта підробітків Києва та області</h2>
  <div id="status">Знайдіть адресу або встановіть свою позначку.</div>
</div>

<div id="map">
  <button id="menuButton" type="button" aria-label="Відкрити меню">+</button>

<div id="mapMenu" style="display:none;">
  <button id="menuGpsButton" type="button">📍 GPS</button>
  <button id="menuSearchButton" type="button">🔎 Пошук</button>
  <button id="menuAdminButton" type="button">🔐 Адмін</button>
</div>

<div id="searchPanel" style="display:none;">
  <div class="search">
    <input
      id="address"
      type="search"
      placeholder="Місто, вулиця або адреса"
      autocomplete="off"
    >
    <button id="searchButton" type="button">Знайти</button>
  </div>
  <div id="results"></div>
</div>
</div>

<div class="footer" style="display:none;">
  <div id="modeLabel" class="mode-label"></div>

  <button id="gpsButton" class="gps-button" type="button">
    📍 Моє місцезнаходження
  </button>

  <button id="homeButton" class="home-button" type="button">
    🏠 Змінити домашню позначку
  </button>

  <button id="saveButton" class="save-button" type="button">
    Зберегти місце
  </button>

  <button id="cancelButton" class="cancel-button" type="button">
    Скасувати
  </button>
</div>

<script src="./leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
    
// ==================================================
// 1. НАЛАШТУВАННЯ
// ==================================================

const KYIV_CENTER = [50.4501, 30.5234];

const VIEW_KEY = 'parttime_map_view_v3';
const HOME_KEY = 'parttime_home_v3';

// Межі Києва та Київської області
const REGION_BOUNDS = {
  minLat: 49.15,
  maxLat: 51.85,
  minLon: 29.15,
  maxLon: 32.25
};

const tg = window.Telegram?.WebApp || null;

if (tg) {
  tg.ready();
  tg.expand();
}

// ==================================================
// 2. ЕЛЕМЕНТИ СТОРІНКИ
// ==================================================

const addressInput = document.getElementById('address');
const searchButton = document.getElementById('searchButton');
const resultsBox = document.getElementById('results');
const statusBox = document.getElementById('status');

const gpsButton = document.getElementById('gpsButton');
const homeButton = document.getElementById('homeButton');
const saveButton = document.getElementById('saveButton');
const cancelButton = document.getElementById('cancelButton');

const modeLabel = document.getElementById('modeLabel');
const menuButton = document.getElementById('menuButton');
const mapMenu = document.getElementById('mapMenu');
const menuGpsButton = document.getElementById('menuGpsButton');
const menuSearchButton = document.getElementById('menuSearchButton');
const menuAdminButton = document.getElementById('menuAdminButton');
const searchPanel = document.getElementById('searchPanel');
  
menuButton.addEventListener('click', function(event) {
  event.stopPropagation();

  if (searchPanel.style.display === 'block') {
    searchPanel.style.display = 'none';
    mapMenu.style.display = 'flex';
    menuButton.textContent = '+';
    return;
  }

  if (mapMenu.style.display === 'flex') {
    mapMenu.style.display = 'none';
  } else {
    mapMenu.style.display = 'flex';
  }

  menuButton.textContent = '+';
});

menuGpsButton.addEventListener('click', function(event) {
  event.stopPropagation();

  clearTemporaryMarker();
  setMode('home');

  mapMenu.style.display = 'none';
  searchPanel.style.display = 'none';
  menuButton.textContent = '+';

  gpsButton.click();
});

menuSearchButton.addEventListener('click', function(event) {
  event.stopPropagation();

  mapMenu.style.display = 'none';
  menuButton.textContent = '+';
  searchPanel.style.display = 'block';
});

searchPanel.addEventListener('click', function(event) {
  event.stopPropagation();
});
  
// ==================================================
// 3. СТАН
// ==================================================

let mode = 'view';
let selectedPlace = null;
let temporaryMarker = null;
let homeMarker = null;
let homeLocation = null;

// ==================================================
// 4. ДОПОМІЖНІ ФУНКЦІЇ
// ==================================================

function setStatus(message) {
  statusBox.textContent = message;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(char) {
    const entities = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    };

    return entities[char];
  });
}

function isInsideRegion(lat, lon) {
  return (
    Number.isFinite(lat) &&
    Number.isFinite(lon) &&
    lat >= REGION_BOUNDS.minLat &&
    lat <= REGION_BOUNDS.maxLat &&
    lon >= REGION_BOUNDS.minLon &&
    lon <= REGION_BOUNDS.maxLon
  );
}

function setMode(newMode) {
  mode = newMode;

  if (mode === 'home') {
    modeLabel.textContent =
      '🏠 Виберіть місце для домашньої позначки';

    modeLabel.style.display = 'block';

  } else if (mode === 'vacancy') {
    modeLabel.textContent =
      '📍 Виберіть місце роботи для вакансії';

    modeLabel.style.display = 'block';

  } else {
    modeLabel.style.display = 'none';
  }
}

function clearTemporaryMarker() {
  if (temporaryMarker) {
    map.removeLayer(temporaryMarker);
    temporaryMarker = null;
  }

  selectedPlace = null;
}
  
// ІКОНКА ОСОБИСТОЇ ДОМАШНЬОЇ ПОЗНАЧКИ
function createHomeIcon() {
  return L.divIcon({
    className: '',
    html: `
      <div style="
        width:42px;
        height:42px;
        background:white;
        border:2px solid #16a34a;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:27px;
        box-shadow:0 2px 6px #0005;
      ">🏠</div>
    `,
    iconSize: [42, 42],
    iconAnchor: [21, 21]
  });
}
  
// ==================================================
// 5. СТВОРЕННЯ КАРТИ
// ==================================================

let savedView = null;

try {
  savedView = JSON.parse(localStorage.getItem(VIEW_KEY));
} catch (error) {
  savedView = null;
}

let startCenter = KYIV_CENTER;
let startZoom = 9;

if (
  savedView &&
  Array.isArray(savedView.center) &&
  savedView.center.length === 2 &&
  Number.isFinite(savedView.center[0]) &&
  Number.isFinite(savedView.center[1]) &&
  Number.isFinite(savedView.zoom)
) {
  startCenter = savedView.center;
  startZoom = savedView.zoom;
}

const map = L.map('map', {
  zoomControl: true,
  preferCanvas: true
}).setView(startCenter, startZoom);

// Один світлий шар із підписами.
// Не накладаємо два шари з дубльованими написами.
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }
).addTo(map);

// Збереження положення карти на цьому пристрої
map.on('moveend', function() {
  try {
    const center = map.getCenter();

    localStorage.setItem(VIEW_KEY, JSON.stringify({
      center: [center.lat, center.lng],
      zoom: map.getZoom()
    }));
  } catch (error) {
    console.warn('Не вдалося зберегти вигляд карти:', error);
  }
});

  // Ручне встановлення позначки на карті
map.on('click', function(e) {
  if (mode !== 'home' && mode !== 'vacancy') {
    return;
  }

  choosePlace(
    e.latlng.lat,
    e.latlng.lng,
    'Обране місце'
  );
});
  
// ==================================================
// 6. ВІДОБРАЖЕННЯ ВИБРАНОГО МІСЦЯ
// ==================================================

function choosePlace(lat, lon, label) {
  // У режимі перегляду забороняємо встановлювати мітки
  if (mode !== 'home' && mode !== 'vacancy') {
    setStatus('👁️ Режим перегляду. Додавати позначки вам не дозволено.');
    return;
  }

  lat = Number(lat);
  lon = Number(lon);

  if (!isInsideRegion(lat, lon)) {
    setStatus('Це місце за межами Києва та Київської області.');
    return;
  }

  if (temporaryMarker) {
    map.removeLayer(temporaryMarker);
  }

  selectedPlace = {
    lat: lat,
    lon: lon,
    label: label || 'Вибране місце'
  };

  {
    const markerEmoji = mode === 'home' ? '🏠' : '📍';

    const markerIcon = L.divIcon({
      className: '',
      html: `
        <div style="
          position:relative;
          width:76px;
          height:68px;
          text-align:center;
        ">
          <button type="button" class="home-confirm"
            style="
              position:absolute;
              top:0;
              left:2px;
              width:25px;
              height:25px;
              border:0;
              border-radius:50%;
              background:white;
              color:#16a34a;
              font-size:22px;
              font-weight:bold;
              line-height:25px;
              padding:0;
              box-shadow:0 1px 5px #0005;
            ">✓</button>

          <button type="button" class="home-cancel"
            style="
              position:absolute;
              top:0;
              right:2px;
              width:25px;
              height:25px;
              border:0;
              border-radius:50%;
              background:white;
              color:#dc2626;
              font-size:22px;
              font-weight:bold;
              line-height:25px;
              padding:0;
              box-shadow:0 1px 5px #0005;
            ">×</button>

          <div style="
            position:absolute;
            bottom:0;
            left:0;
            width:76px;
            font-size:34px;
            line-height:40px;
          ">${markerEmoji}</div>
        </div>
      `,
      iconSize: [76, 68],
      iconAnchor: [38, 62]
    });

    temporaryMarker = L.marker([lat, lon], {
      icon: markerIcon
    }).addTo(map);

    const markerElement = temporaryMarker.getElement();

    L.DomEvent.disableClickPropagation(markerElement);

    markerElement.querySelector('.home-confirm')
      .addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();
        saveButton.click();
      });

    markerElement.querySelector('.home-cancel')
      .addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();
        cancelButton.click();
      });
  }

  map.setView([lat, lon], 16);

  setStatus(
    'Перевірте місце та натисніть зелену галочку для збереження або червоний хрестик для скасування.'
  );
}

// ==================================================
// 7. ЗАВАНТАЖЕННЯ ДОМАШНЬОЇ ПОЗНАЧКИ
// ==================================================

function loadHomeMarker() {
  try {
    const saved = JSON.parse(localStorage.getItem(HOME_KEY));

    if (
      !saved ||
      !isInsideRegion(Number(saved.lat), Number(saved.lon))
    ) {
      return;
    }

    homeLocation = {
      lat: Number(saved.lat),
      lon: Number(saved.lon),
      label: saved.label || 'Моя домашня позначка'
    };

    homeMarker = L.marker([
      homeLocation.lat,
      homeLocation.lon
    ]).addTo(map);

    homeMarker.setIcon(createHomeIcon());
    homeMarker.setZIndexOffset(1000);

    homeMarker.bindPopup(
      '<b>🏠 Моя домашня позначка</b><br>' +
      escapeHTML(homeLocation.label)
    );

  } catch (error) {
    console.warn('Помилка завантаження домашньої позначки:', error);
  }
}

loadHomeMarker();

// ==================================================
// СПІЛЬНІ ПОЗНАЧКИ ВАКАНСІЙ
// ==================================================

const MAP_API_URL = 'https://telegram-bot-production-b3fe24ca.up.railway.app';

async function loadSharedMarkers() {
  try {
    const response = await fetch(
      MAP_API_URL + '/api/markers'
    );

    if (!response.ok) {
      throw new Error('Помилка завантаження міток');
    }

    const data = await response.json();

    const params = new URLSearchParams(window.location.search);

    // Отримуємо параметр запуску Telegram
    const startParam =
      (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ||
      params.get('startapp') ||
      params.get('tgWebAppStartParam') ||
      '';

    // Визначаємо ID вакансії, якщо відкрили конкретну мітку
    const requestedMarkerId = startParam.startsWith('marker_')
      ? startParam.substring(7)
      : params.get('marker_id');

    let selectedMarker = null;

    (data.markers || []).forEach(marker => {
      const isClosed = Number(marker.is_closed) === 1;

      let vacancyMarker;

      if (isClosed) {
        const closedIcon = L.divIcon({
          className: 'closed-vacancy-marker',
          html: '<div style="' +
            'width:32px;' +
            'height:32px;' +
            'background:#e53935;' +
            'border:3px solid white;' +
            'border-radius:50%;' +
            'display:flex;' +
            'align-items:center;' +
            'justify-content:center;' +
            'color:white;' +
            'font-size:23px;' +
            'font-weight:bold;' +
            'box-shadow:0 2px 6px rgba(0,0,0,0.4);' +
          '">×</div>',
          iconSize: [38, 38],
          iconAnchor: [19, 19],
          popupAnchor: [0, -19]
        });

        vacancyMarker = L.marker(
          [
            Number(marker.latitude),
            Number(marker.longitude)
          ],
          { icon: closedIcon }
        ).addTo(map);

      } else {
        vacancyMarker = L.marker([
          Number(marker.latitude),
          Number(marker.longitude)
        ]).addTo(map);
      }

      const vacancyUrl =
        'https://t.me/kiev_part_time_job/' +
        encodeURIComponent(marker.message_id);

      vacancyMarker.bindPopup(
        (isClosed
          ? '<b>❌ Вакансія не актуальна</b><br>'
          : '<b>📍 Вакансія</b><br>') +
        escapeHTML(marker.text) +
        '<br><br>' +
        '<a class="open-vacancy-link" href="' +
        vacancyUrl +
        '">Відкрити оголошення</a>'
      );

      vacancyMarker.on('popupopen', function(event) {
        const link = event.popup
          .getElement()
          .querySelector('.open-vacancy-link');

        if (!link) return;

        link.addEventListener('click', function(clickEvent) {
          clickEvent.preventDefault();

          if (tg && typeof tg.openTelegramLink === 'function') {
            tg.openTelegramLink(vacancyUrl);

            setTimeout(function() {
              if (typeof tg.close === 'function') {
                tg.close();
              }
            }, 500);

          } else {
            window.location.href = vacancyUrl;
          }
        }, { once: true });
      });

      if (
        requestedMarkerId &&
        String(marker.id) === String(requestedMarkerId)
      ) {
        selectedMarker = {
          marker: vacancyMarker,
          latitude: Number(marker.latitude),
          longitude: Number(marker.longitude)
        };
      }
    });

    // Відкриваємо потрібну вакансію на карті
    if (selectedMarker) {
      map.setView(
        [
          selectedMarker.latitude,
          selectedMarker.longitude
        ],
        17
      );

      selectedMarker.marker.openPopup();
    }

  } catch (error) {
    console.warn('Помилка спільних позначок:', error);
  }
}

loadSharedMarkers();

// ==================================================
// 8. РЕЖИМ ЗМІНИ ДОМАШНЬОЇ ПОЗНАЧКИ
// ==================================================

homeButton.addEventListener('click', function() {
  clearTemporaryMarker();
  setMode('home');

  setStatus(
    'Натисніть на карту або знайдіть адресу. ' +
    'Стара позначка залишиться до підтвердження нової.'
  );
});



// ==================================================
// 9. ПОШУК АДРЕСИ
// ==================================================


async function searchAddress() {
  const originalQuery = addressInput.value.trim();

  if (!originalQuery) {
    setStatus('Введіть місто, вулицю або адресу.');
    return;
  }

  const query = originalQuery
    .replace(/^(вулиця|вул\.?|улица|ул\.?)\s*/i, '')
    .replace(/\s+/g, ' ')
    .trim();

  searchButton.disabled = true;
  resultsBox.style.display = 'none';
  resultsBox.innerHTML = '';

  try {
    let found = [];

    // 1. Основний пошук через Nominatim
    try {
      setStatus('Шукаємо адресу в Києві...');

      const params = new URLSearchParams({
        q: query + ', Київ, Україна',
        format: 'jsonv2',
        addressdetails: '1',
        limit: '15',
        countrycodes: 'ua',
        'accept-language': 'uk'
      });

      const response = await fetch(
        'https://nominatim.openstreetmap.org/search?' +
        params.toString()
      );

      if (!response.ok) {
        throw new Error('Помилка Nominatim');
      }

      const data = await response.json();

      found = data
        .map(function(item) {
          return {
            lat: Number(item.lat),
            lon: Number(item.lon),
            label: item.display_name
          };
        })
        .filter(function(item) {
          return isInsideRegion(item.lat, item.lon);
        });

    } catch (error) {
      console.warn('Основний пошук недоступний:', error);
    }

    // 2. Додатковий пошук через Photon
    if (!found.length) {
      setStatus('Пробуємо знайти адресу...');

      const params = new URLSearchParams({
        q: query,
        lat: '50.4501',
        lon: '30.5234',
        limit: '15',
        lang: 'uk',
        countrycode: 'UA',
        bbox: '29.15,49.15,32.25,51.85'
      });

      const response = await fetch(
        'https://photon.komoot.io/api/?' +
        params.toString()
      );

      if (!response.ok) {
        throw new Error('Додатковий пошук тимчасово недоступний.');
      }

      const data = await response.json();

      found = (data.features || [])
        .map(function(feature) {
          const coordinates = feature.geometry.coordinates;
          const p = feature.properties || {};

          const label = [
            p.name,
            p.street,
            p.housenumber,
            p.city,
            p.state,
            p.country
          ]
            .filter(function(value, index, array) {
              return value && array.indexOf(value) === index;
            })
            .join(', ');

          return {
            lat: Number(coordinates[1]),
            lon: Number(coordinates[0]),
            label: label || query
          };
        })
        .filter(function(item) {
          return isInsideRegion(item.lat, item.lon);
        });
    }

    // 3. Якщо нічого не знайдено
    if (!found.length) {
      setStatus(
        'Адресу не знайдено. Спробуйте інше написання або стару назву.'
      );
      return;
    }

    // 4. Відкриваємо знайдене місце
    function showSearchResult(item) {

      // У режимі перегляду лише підсвічуємо місце
      if (mode === 'view') {

        // Прибираємо попереднє підсвічування
        if (searchAddress.highlight) {
          map.removeLayer(searchAddress.highlight);
          searchAddress.highlight = null;
        }

        // Кольорове підсвічування без геомітки
        searchAddress.highlight = L.circle(
          [item.lat, item.lon],
          {
            radius: 35,
            color: '#f59e0b',
            weight: 4,
            opacity: 1,
            fillColor: '#facc15',
            fillOpacity: 0.45
          }
        ).addTo(map);

        map.setView([item.lat, item.lon], 18);

        setStatus(
          '🔎 Знайдено: ' + item.label
        );

        return;
      }

      // В інших режимах залишаємо стару поведінку
      choosePlace(item.lat, item.lon, item.label);
    }

    // 5. Показуємо результати
    resultsBox.innerHTML = '';

    found.forEach(function(item) {
      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'result';
      button.textContent = item.label;

      button.addEventListener('click', function() {
        showSearchResult(item);

        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';
      });

      resultsBox.appendChild(button);
    });

    if (found.length === 1) {
      showSearchResult(found[0]);

    } else {
      resultsBox.style.display = 'block';

      setStatus(
        'Знайдено адрес: ' + found.length +
        '. Виберіть потрібний варіант.'
      );
    }

  } catch (error) {
    console.error('Помилка пошуку:', error);

    setStatus(
      'Пошук тимчасово недоступний. Спробуйте пізніше.'
    );

  } finally {
    searchButton.disabled = false;
  }
}

// Запуск пошуку кнопкою
searchButton.addEventListener('click', searchAddress);

// Запуск пошуку клавішею Enter
addressInput.addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    searchAddress();
  }
});

// ==================================================
// 10. GPS
// ==================================================

gpsButton.addEventListener('click', function() {
  if (mode !== 'home') {
    setMode('home');
  }

  if (!navigator.geolocation) {
    setStatus('GPS недоступний. Натисніть потрібне місце на карті, щоб поставити будиночок.');
    return;
  }

  setStatus('Визначаємо ваше місцезнаходження...');

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      if (!isInsideRegion(lat, lon)) {
        setStatus(
          'Ваше місцезнаходження за межами Києва та області.'
        );
        return;
      }

      choosePlace(lat, lon, 'Моє місцезнаходження');
    },

    function(error) {
      console.warn('GPS error:', error);

      if (error.code === 1) {
        setStatus(
          'Дозвольте доступ до геолокації або виберіть місце вручну.'
        );
      } else {
        setStatus(
          'Не вдалося визначити GPS. Виберіть місце вручну.'
        );
      }
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});


saveButton.addEventListener('click', async function() {
  if (!selectedPlace) {
    setStatus('Спочатку виберіть місце на карті.');
    return;
  }

  if (mode === 'home') {
    const data = {
      lat: selectedPlace.lat,
      lon: selectedPlace.lon,
      label: selectedPlace.label
    };

    try {
      localStorage.setItem(HOME_KEY, JSON.stringify(data));
    } catch (error) {
      setStatus('Не вдалося зберегти позначку на пристрої.');
      return;
    }

    if (homeMarker) {
      map.removeLayer(homeMarker);
    }

    homeLocation = data;

    homeMarker = L.marker([
      data.lat,
      data.lon
    ]).addTo(map);

    homeMarker.setIcon(createHomeIcon());
    homeMarker.setZIndexOffset(1000);

    homeMarker.bindPopup(
      '<b>🏠 Моя домашня позначка</b><br>' +
      escapeHTML(data.label)
    ).openPopup();

    clearTemporaryMarker();
    setMode('view');

    setStatus(
      'Домашню позначку збережено на цьому пристрої.'
    );

    return;
  }
  
  if (mode === 'vacancy') {
    if (!tg) {
      setStatus('Відкрийте карту через Telegram.');
      return;
    }

    if (!tg.initData) {
      setStatus('Telegram не передав дані для перевірки. Закрийте карту та відкрийте її знову через бота.');
      return;
    }

    const params = new URLSearchParams(window.location.search);

    const requestId =
      params.get('request_id') ||
      (tg.initDataUnsafe && tg.initDataUnsafe.start_param
        ? tg.initDataUnsafe.start_param
        : '');

    if (!requestId) {
      setStatus('Не знайдено запит на додавання вакансії.');
      return;
    }

    saveButton.disabled = true;
    setStatus('Зберігаємо позначку вакансії...');

    try {
      const response = await fetch(MAP_API_URL + '/api/markers', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData: tg.initData,
          request_id: requestId,
          lat: selectedPlace.lat,
          lon: selectedPlace.lon,
          label: selectedPlace.label
        })
      });

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.error || 'Сервер не зміг зберегти позначку.');
      }

      clearTemporaryMarker();
      setMode('view');

      await loadSharedMarkers();

      setStatus('Позначку вакансії успішно збережено! Вона вже відображається на карті.');
    } catch (error) {
      console.error('Помилка збереження вакансії:', error);
      setStatus(error.message || 'Не вдалося зберегти позначку. Спробуйте ще раз.');
    } finally {
      saveButton.disabled = false;
    }

    return;
  }

  setStatus('Оберіть режим перед збереженням.');
});

// ==================================================
// 12. СКАСУВАННЯ
// ==================================================


cancelButton.addEventListener('click', function() {
  clearTemporaryMarker();
  setMode('view');

  setStatus('Зміни скасовано. Збережена позначка не змінена.');
});

// ==================================================
// 13. РЕЖИМ ВІД TELEGRAM
// ==================================================

async function initializeTelegramMode() {
  if (!tg) {
    setStatus('Помилка: Telegram WebApp не знайдено.');
    return;
  }

  const params = new URLSearchParams(window.location.search);

  // Отримуємо параметр запуску з усіх можливих джерел Telegram
  let startParam = '';

  if (tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
    startParam = tg.initDataUnsafe.start_param;
  }

  if (!startParam) {
    startParam = params.get('tgWebAppStartParam') || '';
  }

  if (!startParam) {
    startParam = params.get('startapp') || '';
  }

  if (!startParam && tg.initData) {
    const initParams = new URLSearchParams(tg.initData);
    startParam = initParams.get('start_param') || '';
  }

  // Існуюча вакансія — тільки перегляд
  if (startParam.startsWith('marker_')) {
    setMode('view');

    setStatus(
      '👁️ РЕЖИМ ПЕРЕГЛЯДУ. Ви можете переглядати вакансії, але не можете змінювати їхні позначки.'
    );

    return;
  }

  // Отримуємо ID запиту на додавання нової мітки
  const requestId =
    params.get('request_id') ||
    (
      startParam && !startParam.startsWith('marker_')
        ? startParam
        : ''
    );

  if (!requestId) {
    setMode('view');
    setStatus('Карта відкрита в режимі перегляду.');
    return;
  }

  if (!tg.initData) {
    setMode('view');

    setStatus(
      'Не вдалося перевірити Telegram. Закрийте карту та відкрийте її знову через бота.'
    );

    return;
  }

  setStatus('Перевіряємо ваші права доступу...');

  try {
    const response = await fetch(
      MAP_API_URL + '/api/map-request-access',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData: tg.initData,
          request_id: requestId
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(
        result.error || 'Не вдалося перевірити права доступу.'
      );
    }

    if (result.can_edit === true) {
      setMode('vacancy');
      searchPanel.style.display = 'block';

      setStatus(
        '✅ Доступ дозволено. Можна встановити позначку вакансії.'
      );
    } else {
      setMode('view');

      setStatus(
        '👁️ РЕЖИМ ПЕРЕГЛЯДУ. Ви можете переглядати карту, але не можете додавати позначки.'
      );
    }

  } catch (error) {
    console.error('Помилка перевірки доступу:', error);

    setMode('view');

    setStatus(
      error.message || 'Не вдалося перевірити доступ. Карта відкрита тільки для перегляду.'
    );
  }
}
  
// ЗАПУСК ПЕРЕВІРКИ ПРАВ ДОСТУПУ
initializeTelegramMode();

  setTimeout(function() {
    map.invalidateSize();
  }, 300);
});

window.addEventListener('resize', function() {
  map.invalidateSize();
});
