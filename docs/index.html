
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Карта підробітків Києва та області</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  background: #fff;
  overflow: hidden;
}

.header {
  padding: 12px;
  background: #fff;
  box-shadow: 0 2px 8px #0002;
  z-index: 1000;
}

h2 {
  margin: 0 0 10px;
  font-size: 18px;
  color: #263746;
}

.search {
  display: flex;
  gap: 7px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 13px;
  background: #1684e8;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

#results {
  display: none;
  margin-top: 7px;
  max-height: 180px;
  overflow-y: auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.result {
  display: block;
  width: 100%;
  padding: 11px;
  text-align: left;
  background: white;
  color: #263746;
  border-radius: 0;
  border-bottom: 1px solid #eee;
  line-height: 1.4;
}

#status {
  margin-top: 8px;
  color: #64748b;
  font-size: 12px;
  min-height: 15px;
}

#map {
  flex: 1;
  min-height: 200px;
  width: 100%;
  background: #edf1f3;
}

.footer {
  padding: 10px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: white;
  box-shadow: 0 -2px 8px #0002;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 1000;
}

.buttons {
  display: flex;
  gap: 7px;
}

.buttons button {
  flex: 1;
  min-width: 0;
}

.gps {
  background: #1684e8;
}

.save {
  background: #15965c;
}

.cancel {
  background: #64748b;
}

.mode {
  display: none;
  padding: 9px;
  border-radius: 8px;
  background: #eff6ff;
  color: #1d4e89;
  font-size: 13px;
  text-align: center;
}

.leaflet-popup-content {
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

@media (max-width: 420px) {
  h2 { font-size: 16px; }
  .buttons button { padding: 11px 7px; font-size: 12px; }
}
</style>
</head>

<body>

<div class="header">
  <h2>🗺️ Карта підробітків Києва та області</h2>

  <div class="search">
    <input
      id="address"
      type="search"
      placeholder="Місто, вулиця або адреса"
      autocomplete="off"
    >
    <button id="searchButton">Знайти</button>
  </div>

  <div id="results"></div>
  <div id="status">Знайдіть адресу або визначте своє місцезнаходження.</div>
</div>

<div id="map"></div>

<div class="footer">
  <div id="mode" class="mode"></div>

  <div class="buttons">
    <button class="gps" id="gpsButton">📍 Моє місцезнаходження</button>
    <button class="save" id="saveButton">Зберегти місце</button>
    <button class="cancel" id="cancelButton">Скасувати</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ==================================================
// НАЛАШТУВАННЯ
// ==================================================

const KYIV_CENTER = [50.4501, 30.5234];
const VIEW_KEY = 'parttime_map_view_v2';

// Telegram Web App
const tg = window.Telegram?.WebApp || null;

if (tg) {
  tg.ready();
  tg.expand();
}

// ==================================================
// СТАН КАРТИ
// ==================================================

let map;
let temporaryMarker = null;
let homeMarker = null;
let vacancies = [];
let selectedPlace = null;

let currentMode = 'view';
// view = перегляд
// home = домашня позначка
// vacancy = позначка вакансії

let homeLocation = null;

// ==================================================
// ЕЛЕМЕНТИ
// ==================================================

const statusBox = document.getElementById('status');
const resultsBox = document.getElementById('results');
const addressInput = document.getElementById('address');
const modeBox = document.getElementById('mode');

const searchButton = document.getElementById('searchButton');
const gpsButton = document.getElementById('gpsButton');
const saveButton = document.getElementById('saveButton');
const cancelButton = document.getElementById('cancelButton');

// ==================================================
// ДОПОМІЖНІ ФУНКЦІЇ
// ==================================================

function setStatus(text) {
  statusBox.textContent = text;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

function setMode(mode) {
  currentMode = mode;

  if (mode === 'home') {
    modeBox.textContent = '🏠 Режим встановлення домашньої позначки';
    modeBox.style.display = 'block';
  } else if (mode === 'vacancy') {
    modeBox.textContent = '📍 Режим додавання вакансії';
    modeBox.style.display = 'block';
  } else {
    modeBox.style.display = 'none';
  }
}

function clearTemporaryMarker() {
  if (temporaryMarker) {
    map.removeLayer(temporaryMarker);
    temporaryMarker = null;
  }

  selectedPlace = null;
}

// ==================================================
// СТВОРЕННЯ КАРТИ
// ==================================================

let savedView = null;

try {
  savedView = JSON.parse(localStorage.getItem(VIEW_KEY));
} catch(e) {}

const startCenter =
  savedView &&
  Array.isArray(savedView.center) &&
  savedView.center.length === 2
    ? savedView.center
    : KYIV_CENTER;

const startZoom =
  savedView && Number.isFinite(savedView.zoom)
    ? savedView.zoom
    : 9;

map = L.map('map', {
  zoomControl: true,
  preferCanvas: true
}).setView(startCenter, startZoom);

// Світла карта без зайвих підписів
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
  {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }
).addTo(map);

// Підписи доріг, міст та районів окремим шаром
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
  {
    maxZoom: 19,
    pane: 'overlayPane',
    attribution: ''
  }
).addTo(map);

// Збереження масштабу та положення на цьому пристрої
map.on('moveend', function() {
  try {
    const c = map.getCenter();

    localStorage.setItem(VIEW_KEY, JSON.stringify({
      center: [c.lat, c.lng],
      zoom: map.getZoom()
    }));
  } catch(e) {}
});

// ==================================================
// ВИБІР МІСЦЯ
// ==================================================

function choosePlace(lat, lon, label) {
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
    setStatus('Не вдалося визначити координати.');
    return;
  }

  if (temporaryMarker) {
    map.removeLayer(temporaryMarker);
  }

  selectedPlace = {
    lat: lat,
    lon: lon,
    label: label || 'Вибране місце'
  };

  temporaryMarker = L.marker([lat, lon]).addTo(map);

  temporaryMarker.bindPopup(
    '<b>' + escapeHTML(selectedPlace.label) + '</b><br>' +
    'Підтвердіть вибір кнопкою «Зберегти місце».'
  ).openPopup();

  map.setView([lat, lon], 16);

  setStatus('Вибране місце: ' + selectedPlace.label);
}

// Звичайне натискання на карту лише вибирає
// місце, але не змінює збережену домашню позначку
map.on('click', function(e) {
  if (currentMode === 'view') {
    setStatus('Щоб змінити домашню позначку, спочатку увімкніть режим її зміни.');
    return;
  }

  choosePlace(
    e.latlng.lat,
    e.latlng.lng,
    'Вибране місце'
  );
});

// ==================================================
// ПОШУК АДРЕСИ
// ==================================================

async function searchAddress() {
  const q = addressInput.value.trim();

  if (!q) {
    setStatus('Введіть адресу.');
    return;
  }

  searchButton.disabled = true;
  resultsBox.style.display = 'none';
  resultsBox.innerHTML = '';

  setStatus('Шукаємо адресу...');

  try {
    let found = [];

    // Photon
    try {
      const params = new URLSearchParams({
        q: q + ', Україна',
        lang: 'uk',
        limit: '8',
        lat: '50.4501',
        lon: '30.5234'
      });

      const response = await fetch(
        'https://photon.komoot.io/api/?' + params
      );

      if (response.ok) {
        const data = await response.json();

        found = (data.features || []).map(function(item) {
          const p = item.properties || {};
          const coords = item.geometry.coordinates;

          const label = [
            p.name,
            p.housenumber,
            p.street,
            p.city || p.town || p.village || p.county,
            p.state
          ].filter(Boolean).join(', ');

          return {
            lat: Number(coords[1]),
            lon: Number(coords[0]),
            label: label || q
          };
        });
      }
    } catch(e) {
      console.log('Photon error:', e);
    }

    // Резервний пошук Nominatim
    if (!found.length) {
      const params = new URLSearchParams({
        q: q + ', Україна',
        format: 'jsonv2',
        addressdetails: '1',
        limit: '8',
        countrycodes: 'ua',
        'accept-language': 'uk',
        viewbox: '29.35,51.05,31.15,50.05',
        bounded: '0'
      });

      const response = await fetch(
        'https://nominatim.openstreetmap.org/search?' + params
      );

      if (!response.ok) {
        throw new Error('Пошук тимчасово недоступний');
      }

      const data = await response.json();

      found = data.map(function(item) {
        return {
          lat: Number(item.lat),
          lon: Number(item.lon),
          label: item.display_name
        };
      });
    }

    if (!found.length) {
      setStatus('Адресу не знайдено. Спробуйте інше написання.');
      return;
    }

    resultsBox.innerHTML = '';

    found.forEach(function(item) {
      const btn = document.createElement('button');

      btn.className = 'result';
      btn.textContent = item.label;

      btn.addEventListener('click', function() {
        choosePlace(item.lat, item.lon, item.label);
        resultsBox.style.display = 'none';
      });

      resultsBox.appendChild(btn);
    });

    if (found.length === 1) {
      choosePlace(found[0].lat, found[0].lon, found[0].label);
    } else {
      resultsBox.style.display = 'block';
      setStatus('Знайдено варіантів: ' + found.length + '. Виберіть адресу.');
    }

  } catch(e) {
    console.error(e);
    setStatus('Пошук тимчасово не працює. Спробуйте пізніше.');
  } finally {
    searchButton.disabled = false;
  }
}

searchButton.addEventListener('click', searchAddress);

addressInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    searchAddress();
  }
});

// ==================================================
// GPS
// ==================================================

gpsButton.addEventListener('click', function() {
  if (!navigator.geolocation) {
    setStatus('Ваш браузер не підтримує визначення місцезнаходження.');
    return;
  }

  setStatus('Визначаємо ваше місцезнаходження...');

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      if (lat < 49.5 || lat > 51.5 || lon < 28.5 || lon > 32.0) {
        setStatus('Ви перебуваєте за межами Києва та Київської області.');
        return;
      }

      choosePlace(lat, lon, 'Моє місцезнаходження');
      setStatus('Місце визначено. Натисніть «Зберегти місце».');
    },
    function(error) {
      if (error.code === 1) {
        setStatus('Дозвольте доступ до геолокації або виберіть місце вручну.');
      } else {
        setStatus('Не вдалося визначити GPS. Виберіть місце вручну.');
      }
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});

// ==================================================
// ОСОБИСТА ПОЗНАЧКА
// ==================================================

// Увага: це тимчасове локальне збереження.
// Після підключення сервера воно буде замінене
// приватним збереженням за Telegram ID.

function loadLocalHome() {
  try {
    const data = JSON.parse(localStorage.getItem('parttime_home_v2'));

    if (data && Number.isFinite(data.lat) && Number.isFinite(data.lon)) {
      homeLocation = data;

      homeMarker = L.marker([data.lat, data.lon]).addTo(map);

      homeMarker.bindPopup(
        '<b>🏠 Моя домашня позначка</b><br>' +
        escapeHTML(data.label || '')
      );
    }
  } catch(e) {}
}

loadLocalHome();

// Увімкнення режиму зміни домашньої позначки
// Поки що через натискання на статусний напис.
// Пізніше це буде окрема кнопка в профілі.
function enableHomeMode() {
  setMode('home');
  setStatus('Виберіть нове домашнє місце на карті або через пошук.');
}

// ==================================================
// ЗБЕРЕЖЕННЯ ВИБРАНОГО МІСЦЯ
// ==================================================

saveButton.addEventListener('click', function() {
  if (!selectedPlace) {
    setStatus('Спочатку виберіть місце на карті.');
    return;
  }

  if (currentMode === 'home') {
    const data = {
      lat: selectedPlace.lat,
      lon: selectedPlace.lon,
      label: selectedPlace.label
    };

    try {
      localStorage.setItem('parttime_home_v2', JSON.stringify(data));
    } catch(e) {
      setStatus('Не вдалося зберегти місце.');
      return;
    }

    if (homeMarker) {
      map.removeLayer(homeMarker);
    }

    homeLocation = data;
    homeMarker = L.marker([data.lat, data.lon]).addTo(map);

    homeMarker.bindPopup(
      '<b>🏠 Моя домашня позначка</b><br>' +
      escapeHTML(data.label)
    ).openPopup();

    clearTemporaryMarker();
    setMode('view');

    setStatus('Домашню позначку збережено на цьому пристрої.');

  } else if (currentMode === 'vacancy') {
    // Відправка координат у Telegram Web App.
    // Серверне збереження буде підключено окремо.
    const payload = {
      action: 'vacancy_location_selected',
      lat: selectedPlace.lat,
      lon: selectedPlace.lon,
      label: selectedPlace.label
    };

    if (tg) {
      tg.sendData(JSON.stringify(payload));
      setStatus('Місце передано боту. Очікуйте підтвердження.');
    } else {
      setStatus('Для додавання вакансії відкрийте карту через Telegram.');
    }

  } else {
    setStatus('Спочатку виберіть режим збереження місця.');
  }
});

// ==================================================
// СКАСУВАННЯ
// ==================================================

cancelButton.addEventListener('click', function() {
  clearTemporaryMarker();
  setMode('view');
  setStatus('Вибір скасовано.');
});

// ==================================================
// ЗАПУСК РЕЖИМУ З TELEGRAM
// ==================================================

function readTelegramStartParameter() {
  if (!tg || !tg.initDataUnsafe) return;

  const params = new URLSearchParams(location.search);

  const mode = params.get('mode');

  if (mode === 'home') {
    enableHomeMode();
  }

  if (mode === 'vacancy') {
    setMode('vacancy');
    setStatus('Виберіть місце роботи для вакансії.');
  }
}

readTelegramStartParameter();

// ==================================================
// ПІДГОНКА РОЗМІРУ КАРТИ
// ==================================================

setTimeout(function() {
  map.invalidateSize();
}, 300);

window.addEventListener('resize', function() {
  map.invalidateSize();
});

</script>
</body>
</html>
