
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Карта підробітків Києва та області</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #fff;
}

.header {
  flex: 0 0 auto;
  padding: 12px;
  background: #fff;
  box-shadow: 0 2px 8px #0002;
  z-index: 1000;
}

h2 {
  margin: 0 0 10px;
  font-size: 18px;
  color: #263746;
}

.search {
  display: flex;
  gap: 7px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #1684e8;
}

button {
  padding: 11px 13px;
  border: 0;
  border-radius: 9px;
  background: #1684e8;
  color: white;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

#results {
  display: none;
  margin-top: 7px;
  max-height: 180px;
  overflow-y: auto;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.result {
  display: block;
  width: 100%;
  padding: 11px;
  text-align: left;
  background: white;
  color: #263746;
  border-radius: 0;
  border-bottom: 1px solid #eee;
  line-height: 1.4;
}

.result:hover {
  background: #f1f5f9;
}

#status {
  margin-top: 7px;
  min-height: 15px;
  font-size: 12px;
  color: #64748b;
}

#map {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  background: #edf1f3;
}

.footer {
  flex: 0 0 auto;
  padding: 10px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: white;
  box-shadow: 0 -2px 8px #0002;
  z-index: 1000;
}

.mode-label {
  display: none;
  margin-bottom: 8px;
  padding: 9px;
  border-radius: 8px;
  background: #eff6ff;
  color: #1d4e89;
  font-size: 13px;
  text-align: center;
}

.button-row {
  display: flex;
  gap: 7px;
}

.button-row button {
  flex: 1;
  min-width: 0;
  padding: 11px 6px;
  font-size: 12px;
}

.gps-button { background: #1684e8; }
.home-button { background: #475569; }
.save-button { background: #15965c; }
.cancel-button { background: #64748b; }

.leaflet-popup-content {
  line-height: 1.5;
  overflow-wrap: anywhere;
}

@media (max-width: 380px) {
  h2 { font-size: 16px; }
  .button-row { flex-wrap: wrap; }
  .button-row button { flex: 1 1 30%; }
}
</style>
</head>

<body>

<div class="header">
  <h2>🗺️ Карта підробітків Києва та області</h2>

  <div class="search">
    <input
      id="address"
      type="search"
      placeholder="Місто, вулиця або адреса"
      autocomplete="off"
    >
    <button id="searchButton" type="button">Знайти</button>
  </div>

  <div id="results"></div>
  <div id="status">Знайдіть адресу або встановіть свою позначку.</div>
</div>

<div id="map"></div>

<div class="footer">
  <div id="modeLabel" class="mode-label"></div>

  <div class="button-row">
    <button id="gpsButton" class="gps-button" type="button">
      📍 Моє місцезнаходження
    </button>

    <button id="homeButton" class="home-button" type="button">
      🏠 Змінити домашню позначку
    </button>
  </div>

  <div class="button-row" style="margin-top:7px">
    <button id="saveButton" class="save-button" type="button">
      Зберегти місце
    </button>

    <button id="cancelButton" class="cancel-button" type="button">
      Скасувати
    </button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
'use strict';

// ==================================================
// 1. НАЛАШТУВАННЯ
// ==================================================

const KYIV_CENTER = [50.4501, 30.5234];

const VIEW_KEY = 'parttime_map_view_v3';
const HOME_KEY = 'parttime_home_v3';

// Межі Києва та Київської області
const REGION_BOUNDS = {
  minLat: 49.15,
  maxLat: 51.85,
  minLon: 29.15,
  maxLon: 32.25
};

const tg = window.Telegram?.WebApp || null;

if (tg) {
  tg.ready();
  tg.expand();
}

// ==================================================
// 2. ЕЛЕМЕНТИ СТОРІНКИ
// ==================================================

const addressInput = document.getElementById('address');
const searchButton = document.getElementById('searchButton');
const resultsBox = document.getElementById('results');
const statusBox = document.getElementById('status');

const gpsButton = document.getElementById('gpsButton');
const homeButton = document.getElementById('homeButton');
const saveButton = document.getElementById('saveButton');
const cancelButton = document.getElementById('cancelButton');

const modeLabel = document.getElementById('modeLabel');

// ==================================================
// 3. СТАН
// ==================================================

let mode = 'view';
let selectedPlace = null;
let temporaryMarker = null;
let homeMarker = null;
let homeLocation = null;

// ==================================================
// 4. ДОПОМІЖНІ ФУНКЦІЇ
// ==================================================

function setStatus(message) {
  statusBox.textContent = message;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(char) {
    const entities = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    };

    return entities[char];
  });
}

function isInsideRegion(lat, lon) {
  return (
    Number.isFinite(lat) &&
    Number.isFinite(lon) &&
    lat >= REGION_BOUNDS.minLat &&
    lat <= REGION_BOUNDS.maxLat &&
    lon >= REGION_BOUNDS.minLon &&
    lon <= REGION_BOUNDS.maxLon
  );
}

function setMode(newMode) {
  mode = newMode;

  if (mode === 'home') {
    modeLabel.textContent =
      '🏠 Виберіть місце для домашньої позначки';

    modeLabel.style.display = 'block';

  } else if (mode === 'vacancy') {
    modeLabel.textContent =
      '📍 Виберіть місце роботи для вакансії';

    modeLabel.style.display = 'block';

  } else {
    modeLabel.style.display = 'none';
  }
}

function clearTemporaryMarker() {
  if (temporaryMarker) {
    map.removeLayer(temporaryMarker);
    temporaryMarker = null;
  }

  selectedPlace = null;
}

// ==================================================
// 5. СТВОРЕННЯ КАРТИ
// ==================================================

let savedView = null;

try {
  savedView = JSON.parse(localStorage.getItem(VIEW_KEY));
} catch (error) {
  savedView = null;
}

let startCenter = KYIV_CENTER;
let startZoom = 9;

if (
  savedView &&
  Array.isArray(savedView.center) &&
  savedView.center.length === 2 &&
  Number.isFinite(savedView.center[0]) &&
  Number.isFinite(savedView.center[1]) &&
  Number.isFinite(savedView.zoom)
) {
  startCenter = savedView.center;
  startZoom = savedView.zoom;
}

const map = L.map('map', {
  zoomControl: true,
  preferCanvas: true
}).setView(startCenter, startZoom);

// Один світлий шар із підписами.
// Не накладаємо два шари з дубльованими написами.
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }
).addTo(map);

// Збереження положення карти на цьому пристрої
map.on('moveend', function() {
  try {
    const center = map.getCenter();

    localStorage.setItem(VIEW_KEY, JSON.stringify({
      center: [center.lat, center.lng],
      zoom: map.getZoom()
    }));
  } catch (error) {
    console.warn('Не вдалося зберегти вигляд карти:', error);
  }
});

// ==================================================
// 6. ВІДОБРАЖЕННЯ ВИБРАНОГО МІСЦЯ
// ==================================================

function choosePlace(lat, lon, label) {
  lat = Number(lat);
  lon = Number(lon);

  if (!isInsideRegion(lat, lon)) {
    setStatus('Це місце за межами Києва та Київської області.');
    return;
  }

  if (temporaryMarker) {
    map.removeLayer(temporaryMarker);
  }

  selectedPlace = {
    lat: lat,
    lon: lon,
    label: label || 'Вибране місце'
  };

  temporaryMarker = L.marker([lat, lon]).addTo(map);

  temporaryMarker.bindPopup(
    '<b>' + escapeHTML(selectedPlace.label) + '</b>'
  ).openPopup();

  map.setView([lat, lon], 16);

  setStatus(
    'Обране місце: ' + selectedPlace.label +
    '. Натисніть «Зберегти місце».'
  );
}

// Натискання на карту дозволене лише в режимі редагування
map.on('click', function(event) {
  if (mode !== 'home' && mode !== 'vacancy') {
    setStatus('Щоб вибрати місце, спочатку увімкніть потрібний режим.');
    return;
  }

  choosePlace(
    event.latlng.lat,
    event.latlng.lng,
    'Вибране місце'
  );
});

// ==================================================
// 7. ЗАВАНТАЖЕННЯ ДОМАШНЬОЇ ПОЗНАЧКИ
// ==================================================

function loadHomeMarker() {
  try {
    const saved = JSON.parse(localStorage.getItem(HOME_KEY));

    if (
      !saved ||
      !isInsideRegion(Number(saved.lat), Number(saved.lon))
    ) {
      return;
    }

    homeLocation = {
      lat: Number(saved.lat),
      lon: Number(saved.lon),
      label: saved.label || 'Моя домашня позначка'
    };

    homeMarker = L.marker([
      homeLocation.lat,
      homeLocation.lon
    ]).addTo(map);

    homeMarker.bindPopup(
      '<b>🏠 Моя домашня позначка</b><br>' +
      escapeHTML(homeLocation.label)
    );

  } catch (error) {
    console.warn('Помилка завантаження домашньої позначки:', error);
  }
}

loadHomeMarker();

// ==================================================
// 8. РЕЖИМ ЗМІНИ ДОМАШНЬОЇ ПОЗНАЧКИ
// ==================================================

homeButton.addEventListener('click', function() {
  clearTemporaryMarker();
  setMode('home');

  setStatus(
    'Натисніть на карту або знайдіть адресу. ' +
    'Стара позначка залишиться до підтвердження нової.'
  );
});

// ==================================================
// 9. ПОШУК АДРЕСИ
// ==================================================

async function searchAddress() {
  const query = addressInput.value.trim();

  if (!query) {
    setStatus('Введіть місто, вулицю або адресу.');
    return;
  }

  searchButton.disabled = true;
  resultsBox.style.display = 'none';
  resultsBox.innerHTML = '';

  setStatus('Шукаємо адресу...');

  try {
    const params = new URLSearchParams({
      q: query + ', Київська область, Україна',
      format: 'jsonv2',
      addressdetails: '1',
      limit: '10',
      countrycodes: 'ua',
      'accept-language': 'uk',
      viewbox: '29.15,51.85,32.25,49.15',
      bounded: '1'
    });

    const response = await fetch(
      'https://nominatim.openstreetmap.org/search?' +
      params.toString()
    );

    if (!response.ok) {
      throw new Error('Сервіс пошуку повернув помилку.');
    }

    const data = await response.json();

    const found = data
      .map(function(item) {
        return {
          lat: Number(item.lat),
          lon: Number(item.lon),
          label: item.display_name
        };
      })
      .filter(function(item) {
        return isInsideRegion(item.lat, item.lon);
      });

    if (!found.length) {
      setStatus('Адресу не знайдено. Спробуйте інше написання.');
      return;
    }

    resultsBox.innerHTML = '';

    found.forEach(function(item) {
      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'result';
      button.textContent = item.label;

      button.addEventListener('click', function() {
        if (mode === 'view') {
          setMode('home');
        }

        choosePlace(item.lat, item.lon, item.label);

        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';
      });

      resultsBox.appendChild(button);
    });

    if (found.length === 1) {
      if (mode === 'view') {
        setMode('home');
      }

      choosePlace(
        found[0].lat,
        found[0].lon,
        found[0].label
      );

    } else {
      resultsBox.style.display = 'block';

      setStatus(
        'Знайдено адрес: ' + found.length +
        '. Виберіть потрібний варіант.'
      );
    }

  } catch (error) {
    console.error('Помилка пошуку:', error);

    setStatus(
      'Пошук тимчасово недоступний. Спробуйте пізніше.'
    );

  } finally {
    searchButton.disabled = false;
  }
}

searchButton.addEventListener('click', searchAddress);

addressInput.addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    searchAddress();
  }
});

// ==================================================
// 10. GPS
// ==================================================

gpsButton.addEventListener('click', function() {
  if (!navigator.geolocation) {
    setStatus('Браузер не підтримує визначення місцезнаходження.');
    return;
  }

  if (mode === 'view') {
    setMode('home');
  }

  setStatus('Визначаємо ваше місцезнаходження...');

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      if (!isInsideRegion(lat, lon)) {
        setStatus(
          'Ваше місцезнаходження за межами Києва та області.'
        );
        return;
      }

      choosePlace(lat, lon, 'Моє місцезнаходження');
    },

    function(error) {
      console.warn('GPS error:', error);

      if (error.code === 1) {
        setStatus(
          'Дозвольте доступ до геолокації або виберіть місце вручну.'
        );
      } else {
        setStatus(
          'Не вдалося визначити GPS. Виберіть місце вручну.'
        );
      }
    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});

// ==================================================
// 11. ЗБЕРЕЖЕННЯ ДОМАШНЬОЇ ПОЗНАЧКИ
// ==================================================

saveButton.addEventListener('click', function() {
  if (!selectedPlace) {
    setStatus('Спочатку виберіть місце на карті.');
    return;
  }

  if (mode === 'home') {
    const data = {
      lat: selectedPlace.lat,
      lon: selectedPlace.lon,
      label: selectedPlace.label
    };

    try {
      localStorage.setItem(HOME_KEY, JSON.stringify(data));
    } catch (error) {
      setStatus('Не вдалося зберегти позначку на пристрої.');
      return;
    }

    if (homeMarker) {
      map.removeLayer(homeMarker);
    }

    homeLocation = data;

    homeMarker = L.marker([
      data.lat,
      data.lon
    ]).addTo(map);

    homeMarker.bindPopup(
      '<b>🏠 Моя домашня позначка</b><br>' +
      escapeHTML(data.label)
    ).openPopup();

    clearTemporaryMarker();
    setMode('view');

    setStatus(
      'Домашню позначку збережено на цьому пристрої.'
    );

    return;
  }

  if (mode === 'vacancy') {
    if (!tg) {
      setStatus('Відкрийте карту через Telegram.');
      return;
    }

    const payload = {
      action: 'vacancy_location_selected',
      lat: selectedPlace.lat,
      lon: selectedPlace.lon,
      label: selectedPlace.label
    };

    try {
      tg.sendData(JSON.stringify(payload));
      setStatus('Дані передано Telegram-боту.');
    } catch (error) {
      console.error(error);
      setStatus('Не вдалося передати дані боту.');
    }

    return;
  }

  setStatus('Оберіть режим перед збереженням.');
});

// ==================================================
// 12. СКАСУВАННЯ
// ==================================================

cancelButton.addEventListener('click', function() {
  clearTemporaryMarker();
  setMode('view');

  setStatus('Зміни скасовано. Збережена позначка не змінена.');
});

// ==================================================
// 13. РЕЖИМ ВІД TELEGRAM
// ==================================================

function initializeTelegramMode() {
  if (!tg) return;

  const params = new URLSearchParams(window.location.search);

  const requestedMode = params.get('mode');

  if (requestedMode === 'vacancy') {
    setMode('vacancy');

    setStatus(
      'Виберіть адресу або місце роботи для вакансії.'
    );
  }
}

initializeTelegramMode();

// ==================================================
// 14. ОСТАТОЧНЕ НАЛАШТУВАННЯ РОЗМІРУ
// ==================================================

window.addEventListener('load', function() {
  setTimeout(function() {
    map.invalidateSize();
  }, 300);
});

window.addEventListener('resize', function() {
  map.invalidateSize();
});

</script>
</body>
</html>
