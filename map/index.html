<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта підробітків</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;background:#fff}
.header{padding:14px;background:#fff;z-index:1000}
h2{margin:0 0 12px;font-size:21px}
.search{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:9px;background:#1684e8;color:white;font-size:15px}
#map{flex:1;min-height:300px}
#status{font-size:13px;color:#555;margin-top:8px}
</style>
</head>

<body>
<div class="header">
<h2>🗺️ Карта підробітків</h2>
<div class="search">
<input id="address" placeholder="Введіть місто або адресу">
<button onclick="searchAddress()">Знайти</button>
</div>
<div id="status">Знайдіть адресу або натисніть на карту, щоб поставити мітку.</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([50.4501,30.5234],9);

L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
{
maxZoom:19,
attribution:'Tiles © Esri'
}
).addTo(map);

let marker=null;

function setMarker(lat,lon,label){
 if(marker) map.removeLayer(marker);

 marker=L.marker([lat,lon]).addTo(map);
 marker.bindPopup(label || 'Вибране місце').openPopup();

 map.setView([lat,lon],16);

 document.getElementById('status').textContent=
 'Координати: '+lat.toFixed(5)+', '+lon.toFixed(5);
}

map.on('click',function(e){
 setMarker(e.latlng.lat,e.latlng.lng,'Вибране місце');
});

async function searchAddress(){
 const q=document.getElementById('address').value.trim();
 const status=document.getElementById('status');

 if(!q){
  status.textContent='Введіть адресу.';
  return;
 }

 status.textContent='Шукаємо адресу...';

 try{
  const url='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?SingleLine='
  +encodeURIComponent(q)+'&maxLocations=1&f=pjson';

  const response=await fetch(url);
  const data=await response.json();

  if(!data.candidates || !data.candidates.length){
   status.textContent='Адресу не знайдено.';
   return;
  }

  const result=data.candidates[0];

  setMarker(
   result.location.y,
   result.location.x,
   result.address
  );

  status.textContent='Знайдено: '+result.address;

 }catch(error){
  status.textContent='Помилка пошуку. Спробуйте ще раз.';
 }
}

document.getElementById('address').addEventListener('keydown',e=>{
 if(e.key==='Enter') searchAddress();
});
</script>
</body>
</html>
